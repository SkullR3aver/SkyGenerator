name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: SkyGenerator/pom.xml
      - run: mvn -B clean package
        working-directory: SkyGenerator
      - uses: actions/upload-artifact@v4
        with:
          name: SkyGenerator-jar
          path: SkyGenerator/target/SkyGenerator-*.jar
