  gui-shop-title: "&8Sklep z generatorami"
  gui-storage-title: "&8Magazyn generatora"
  bought: "&aKupiłeś &f%name%&a!"
  not-enough: "&cNie stać Cię! Potrzebujesz &f%amount%x %item%&c."
  placed: "&aPostawiłeś &f%name%&a. Kliknij prawym, aby otworzyć magazyn."
  limit: "&cOsiągnąłeś limit generatorów (&f%max%&c)."
  not-owner: "&cTo nie jest Twój generator."
  unknown-type: "&cTen generator ma nieznany typ (sprawdź config)."
  storage-empty: "&cMagazyn jest pusty."
  withdrawn: "&aWyciągnięto &f%amount%x %item%&a."
  inventory-full: "&cEkwipunek pełny - część itemów została w magazynie."
  reloaded: "&aKonfiguracja przeładowana."
  no-permission: "&cNie masz uprawnień."
  player-only: "&cTa komenda jest tylko dla graczy."
  usage-give: "&cUżycie: /sg give <gracz> <typ> [ilość]"
  gave: "&aDano &f%amount%x %name% &agraczowi &f%player%&a."
